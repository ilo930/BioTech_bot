name: BioTech weekly story

on:
  schedule:
    # Fires DAILY at 08:00 UTC; story_bot.py's weekly gate keeps sends to once a
    # week. A missed cron day then delays the story by a day instead of a week.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — print the card in the log, do NOT post"
        type: boolean
        default: true

permissions:
  contents: write   # commit state/ back (who has been posted)

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Write and post the story
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRY_RUN: ${{ (github.event.inputs.dry_run == 'true') && '1' || '' }}
          FORCE_SEND: ${{ (github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: python story_bot.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "No state change."; else
            git commit -m "chore: record posted story [skip ci]" && git push; fi
